{% extends "base.html" %}

{% block title %}Invite candidate{% endblock %}

{% block content %}
<section>
    <h1>Schedule candidate interview</h1>
    <p>Times are entered and displayed in Pakistan Standard Time (Asia/Karachi). They are stored as timezone-aware UTC timestamps.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" name="action" value="check_ai">Check availability with AI</button><button type="submit" name="action" value="confirm_schedule" onclick="return confirm('Confirm this fixed interview date and time?');">Confirm scheduling</button></form>
</section>
{% endblock %}
