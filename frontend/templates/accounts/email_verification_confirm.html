{% extends "base.html" %}

{% block title %}Confirm email verification{% endblock %}

{% block content %}
<section>
    <h1>Confirm your email address</h1>
    <p>Select confirm to use this single-use verification link.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm email</button>
    </form>
</section>
{% endblock %}
