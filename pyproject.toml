[tool.ruff]
target-version = "py314"
line-length = 88
src = ["backend"]
exclude = [
    ".git",
    ".venv",
    "var",
    "model-cache",
    "artifacts",
    "ml/artifacts",
    "ml/datasets",
    "ml/checkpoints",
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings_development.py" = ["F403", "F405"]
"backend/config/settings_production.py" = ["F403", "F405"]
